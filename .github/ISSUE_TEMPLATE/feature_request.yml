name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the workflow problem rather than only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Local-first boundaries
      options:
        - label: This can work without network access, accounts, analytics, or reading the clipboard.
          required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
